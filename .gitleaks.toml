# Gitleaks allowlist.
#
# Scope: ONE directory of archived third-party API responses. Everything else
# in this repository is scanned normally, and that is deliberate — the point
# of this file is to silence a known false positive, not to lower the bar.
#
# What is allowlisted and why
# ---------------------------
# `examples/14-sig-triage/eval/cache/` holds verbatim GitHub Search API
# responses for public `kubernetes/kubernetes` issues. They are the source
# data the 250-issue evaluation corpus was derived from, committed so that a
# reader can verify the corpus matches what the API actually returned rather
# than taking the fetcher's word for it.
#
# Some of those upstream issue bodies contain credential-shaped strings that
# third parties pasted into public bug reports years ago — e.g. an OpenShift
# `sha256~…` token and a Kubernetes service-account JWT. They are:
#   * not ours, and never were;
#   * already public at github.com/kubernetes/kubernetes;
#   * inside the JSON `"body"` field of an issue, i.e. quoted content.
#
# Nothing in this directory is generated by, or grants access to, anything of
# ours. Deleting the files to quiet the scanner was considered and rejected:
# they are the provenance chain for the corpus, and removing evidence to
# silence a tool is the wrong trade in a repository whose entire argument is
# that you should not have to trust the author.
#
# Path-based rather than value-based on purpose: matching the specific token
# strings would be brittle, and a regex loose enough to catch them could mask
# a genuine leak elsewhere. A tight path is the narrower exception.

[allowlist]
  description = "Archived third-party GitHub API responses (eval corpus source data)"

  paths = [
    '''examples/14-sig-triage/eval/cache/.*\.json$''',
  ]
