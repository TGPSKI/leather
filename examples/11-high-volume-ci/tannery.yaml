hide_dir: .state/hides
artifact_dir: .state/artifacts
curing_dir: curings

webhooks:
  - name: github
    path: /webhooks/github
    source: github
    secret: "{{env:GITHUB_WEBHOOK_SECRET}}"
    max_body_bytes: 524288   # 512 KB — GitHub payloads can be large

# Fan-out: all three routes match pull_request and share the same hide_id.
# Each route uses queue_pattern so each event gets its own isolated single-use
# input queue (e.g. pr-meta-01JXABC123) instead of sharing a static queue.
routes:
  - name: pr-metadata
    match:
      source: github
      event_type: pull_request
    hide_kind: github.pull_request
    curing: pr-metadata
    queue_pattern: "pr-meta/{{hide_id}}"

  - name: pr-diff
    match:
      source: github
      event_type: pull_request
    hide_kind: github.pull_request
    curing: pr-diff
    queue_pattern: "pr-diff/{{hide_id}}"

  - name: pr-context
    match:
      source: github
      event_type: pull_request
    hide_kind: github.pull_request
    curing: pr-context
    queue_pattern: "pr-ctx/{{hide_id}}"

queues:
  comments-in:
    concurrency: 8
    max_attempts: 2
    max_depth: 50

  # Prefix-scan curings (queue_prefix in their .curing.yaml, one single-use
  # queue per webhook) have no static queue name, so they're keyed here by
  # their queue_prefix instead — matches pr-metadata.curing.yaml's
  # queue_prefix: pr-meta, pr-diff.curing.yaml's queue_prefix: pr-diff,
  # pr-context.curing.yaml's queue_prefix: pr-ctx, and decision.curing.yaml's
  # queue_prefix: analysis. max_attempts/max_depth are not read for these
  # (per-item retry cap comes from each curing's own max_attempts:, and
  # single-use queues never accumulate depth), but concurrency is — this is
  # what actually bounds how many webhooks each curing processes in parallel.
  pr-meta:
    concurrency: 8
  pr-diff:
    concurrency: 8
  pr-ctx:
    concurrency: 8
  analysis:
    concurrency: 8

