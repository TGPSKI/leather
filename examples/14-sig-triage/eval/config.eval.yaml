agent_dir: agents
tool_dir: tools
state_dir: .state
mcp_servers_file: mcp-servers.yaml
log_level: debug

# Override at runtime: LEATHER_MODEL=<your-model> make 14
# (config `model` is a plain value -- {{env:}} is NOT expanded here; the
#  LEATHER_MODEL env override is the mechanism. See docs/TEMPLATES.md.)
model: llama3
llm_timeout: 120s

# Greedy decode, for a reproducible gate. Since leather v0.5.1 (issue #56)
# either this OR agent frontmatter alone works; the agents also carry
# `temperature: 0` because their bytes are pinned by agent_sha in the run
# manifests -- see the "Reproducibility" note in eval/README.md.
temperature: 0
max_tokens: 8192
completion_reserve: 1024
summarize_threshold: 0.85

api: true
api_addr: 127.0.0.1:7750

scheduler_tick: 1s
max_concurrent_jobs: 4
persist_runs: true
