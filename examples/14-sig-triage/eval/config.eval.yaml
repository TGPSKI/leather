agent_dir: agents
tool_dir: tools
state_dir: .state
mcp_servers_file: mcp-servers.yaml
log_level: debug

# Override at runtime: LEATHER_MODEL=<your-model> make 14
# (config `model` is a plain value -- {{env:}} is NOT expanded here; the
#  LEATHER_MODEL env override is the mechanism. See docs/TEMPLATES.md.)
model: llama3
llm_timeout: 120s

# Greedy decode, for a reproducible gate. This MUST be set in BOTH places: here
# AND as `temperature: 0` in every agents/*.agent.md. Neither alone works -- see
# the "Reproducibility" note in eval/README.md. Do not drop either one.
temperature: 0
max_tokens: 8192
completion_reserve: 1024
summarize_threshold: 0.85

api: true
api_addr: 127.0.0.1:7750

scheduler_tick: 1s
max_concurrent_jobs: 4
persist_runs: true
